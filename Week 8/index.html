<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 8 | Loops Arrays and Objects!</title>
</head>

<body>

    <!-- Setting up movies -->
    <div id="favoriteMovies">
        <h2>My Favorite Movies are: </h2>
        <!-- Un ordered list -->
        <ul id="listOfMovies">

        </ul>


    </div>




    <script>

        var numberForLoop = 0

        //Using Let isntead of var
        //Let makes it a local variable
        //The condition needs to be true to start running
        //It stops when the condition is false
        for (let i = 0; i <= 54; i += 2) {
            numberForLoop += 6

            console.log(numberForLoop)
        }

        //Creating a function and then calling
        //That function 73 times
        function pizzaSquares()
        {
            console.log("Pizza")
        }

        for(let i = 0; i <= 72; i++)
        {
            pizzaSquares()
        }

        //Examples of arrays
        var movies = [
            "Spider-Man",
            "Spirited Away",
            "Avengers",
            "Conjuring",
            "The Minecraft Movie",
            "Minions Movie",
            "Howls Moving Castle"
        ]

        console.log(movies[4])
        console.log(movies[2])
       
        //out put all the movies
        // .length returns the size of an array
        for(let i = 0; i < movies.length; i++)
        {
            console.log(movies[i])
        }

        var numberArray = []

        //Adding elements to an array
        for(let i =0; i < 7; i++)
        {
            numberArray.push(i * 5432 / 93 + 23)
        }
        console.log(numberArray)

        //An array can hold several different things
        //HOWEVER, YOU SHOULD NOT DO THIS.
        //ALL VALUES SHOULD BE THE SAME DATA TYPE
        var uniqueArray = [
            "hello",
            2,
            false,
            [1,2,3,54,67]
        ]

        //An example of a 2d array
        //Make sure all arrays are the same size!
        var twoDArray = [
            [0,0,0,0,0,0],
            [1,24,57,85,1,1,6,7],
            [23,123,6234,124,123,1],
            [1,2,3,4,5,6]
        ]
        
        //Loops through each array
        for(let x = 0; x < twoDArray.length; x++)
        {
            //Loops inside each array to get values
            //Making sure that we only loop through the size of that array
            for(let y = 0; y < twoDArray[x].length; y++)
            {
                //Output the values!+
                console.log(twoDArray[x][y])
            }
        }


        //Objects
        var person = {
            first: "Joel",
            last: "Hanson" //You dont need a comma for the last value in an object
        }

        console.log(person.last)
        console.log(person.first)

        //Changing the values
        person.first = "Gage"
        person.last = "CarrotHead"

        //outputting the new values
        console.log(person.first)
        console.log(person.last)

        var person = {
            first: "tom",
            last: "Henderson"
        }

        console.log(person.first)


        var car ={
            wheels: 2000,
            hasEngine: true,
            oil: "synthetic",
            windows: 1,
            drive: function () {console.log("vroom vroom")}
        }
        //Accessing the data inside car
        console.log("This Car has " + car.wheels + " wheels")
        //Calling the function
        car.drive()


        //Fun examples! with For loops and objects and arrays

        var unorderedMovieList = document.querySelector("#listOfMovies")

        //Looping through the movies array
        for(let i = 0; i < movies.length; i++)
        {
            //Adding to the HTML with each movie
            unorderedMovieList.innerHTML += "<li>" + movies[i] + "</li>"
        }

        //How to loop through all the keys in an object
        for(let objectKey in car)
        {
            console.log(car[objectKey])
        }


    </script>
</body>

</html>
