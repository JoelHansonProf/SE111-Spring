<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 7 | Java?</title>
</head>

<body>

    <h1>Week 7 | Holy crap even more JavaScript!</h1>
    <br>
    <h2>Current Number</h2>
    <!-- Setting up a number -->
    <h2 id="number">0</h2>

    <!-- Setting up buttons! -->
    <input type="button" id="increment" value="Increment">
    <input type="button" id="decrement" value="Decrement">



    <br>
    <hr>
    <h2>The Best Joke in The World</h2>
 
    <!-- Container for the joke -->
    <div id="jokeContainer">
        <!-- THe joke -->
        <div id="theJoke">
            <h3>Where Does A Polar Bear Store it's money?</h3>
        </div>

        <!-- The Answer -->
        <div id="jokeAnswer">
            
        </div>
        <!-- A Button -->
        <input type="button" id="giveAnswer" value="Where?">
    </div>

    <br>
    <hr>
    <h2>Another Example</h2>
    <!-- A text box! -->
    <input type="text" id="textBox" placeholder="Enter some text...">
 
    <!-- Place where we will save text -->
    <div id="storedText">

    </div>

    <!-- A Button -->
    <input type="button" id="saveTextButton" value="Save Text">

    <script>
        // Getting the number text
        var numberText = document.querySelector("#number")

        // Getting the 2 buttons
        var incrementButton = document.querySelector("#increment")
        var decrementButton = document.querySelector("#decrement")

        var currentNumber = 0

        // Adding to currentNumber
        function add() {
            currentNumber++
            console.log(currentNumber)
            // Setting the html
            numberText.innerHTML = currentNumber
        }

        function subtract() {
            currentNumber--

            console.log(currentNumber)
            // Setting the HTML
            numberText.innerHTML = currentNumber
        }

        // Adding an evenet listener.
        // THe first value is the event
        //The second value is the function to call
        incrementButton.addEventListener("click", add)
        decrementButton.addEventListener("click", subtract)



        var answerContainer = document.querySelector("#jokeAnswer")
        var answerButton = document.querySelector("#giveAnswer")

        function giveAnswer()
        {
            // Adding an h4 tag in the answerContainer div
            answerContainer.innerHTML += "<h4>The Snow Bank!</h4>"
        }

        //Event
        answerButton.addEventListener("click", giveAnswer)


        var textBox = document.querySelector("#textBox")
        var saveContainer = document.querySelector("#storedText")
        var saveButton = document.querySelector("#saveTextButton")

        function saveText()
        {
            // Storing the text
            var text = textBox.value
            //Using the stored value
            saveContainer.innerHTML += "<p>" + text + "</p>"
            // Resetting the textBox
            textBox.value = ""
        }

        // Hooking it up to the button 
        saveButton.addEventListener("click",saveText)

    </script>
</body>

</html>
